<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
  <header>
    <div class="logo">
      Weather
    </div>
    <div class="head_search">
      <input type="search" name="head_search" id="head_search" placeholder="Search">
      <button id="searchBTN">Search</button>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="first_Cont">
        <h2 id="cityPlaceHolder">Surkhet</h2>
        <img src="https://cdn.weatherapi.com/weather/64x64/day/353.png" alt="Weather Image">
      </div>
      <div class="last_cont">
        <hr>
        <h3 id="firstHeadThree">Temperature: 23°C</h3><hr>
        <h3 id="secondHeadThree">Temperature: 73.4°F</h3><hr>
        <h3 id="thirdHeadThree">Humidity: 81%</h3><hr>
        <h3 id="fourHeadThree">Wind: 51mpH</h3><hr>
        <h3 id="fiveHeadThree">Cloud: 98%</h3>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
